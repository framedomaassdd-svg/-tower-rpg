<!DOCTYPE html><html><head><meta charset="utf-8"><title>rig test</title>
<style>html,body{margin:0;background:#5a6a5a}canvas{display:block}</style></head><body>
<canvas id="cv" width="1600" height="900"></canvas>
<script src="rig.js?v=145"></script>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const qs=new URLSearchParams(location.search), mode=qs.get('mode')||'grid';
function grid(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#5a6a5a'; ctx.fillRect(0,0,1600,900);
  const cells=[['idle',0],['ready',0],['walk',0],['walk',0.2],['walk',0.4],['attack1',0.2],['attack1',0.3],['attack2',0.25],['attack3',0.26],['attack3',0.4]];
  cells.forEach(([a,t],i)=>{const x=110+(i%5)*310, y=380+Math.floor(i/5)*440;
    ctx.setTransform(1,0,0,1,0,0); ctx.strokeStyle='#888'; ctx.beginPath(); ctx.moveTo(x-140,y); ctx.lineTo(x+140,y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText(a+' '+t,x-130,y+24);
    Rig.draw(ctx,'hero2',a,t,x,y,330,1);});
}
function loop(){ const t=performance.now()/1000; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#5a6a5a'; ctx.fillRect(0,0,1600,900);
  const anims=['ready','walk','run','combo','hit'];
  anims.forEach((a,i)=>{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText(a,90+i*310,120); {let an=a,tt=t; if(a==='combo'){const c=t%2.6; if(c<0.75){an='attack1';tt=c}else if(c<1.45){an='attack2';tt=c-0.75}else{an='attack3';tt=c-1.45}} else if(a==='hit') tt=t%1.2; Rig.draw(ctx,'hero2',an,tt,150+i*310,620,380,1);}});
  requestAnimationFrame(loop);}
(function wait(){ if(!Rig.ready('hero2')) return setTimeout(wait,100); setTimeout(()=>{ if(mode==='grid') grid(); else loop(); },200); })();
</script></body></html>
