<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ทดสอบตัวละครใหม่</title>
<style>
  :root { --bg:#211a17; --panel:#2f2622; --line:#4a3c35; --text:#f3e6d3; --muted:#bba893; --gold:#e8b65a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent }
  header { padding:14px 16px 4px; max-width:900px; margin:auto }
  h1 { font-size:18px; margin:0 0 2px; color:var(--gold) }
  header p { margin:0; color:var(--muted); font-size:13px }
  #stage { display:block; width:100%; max-width:900px; height:min(56vh,460px); margin:8px auto 0; touch-action:none }
  .controls { max-width:900px; margin:auto; padding:6px 16px 24px; display:grid; gap:10px }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center }
  .row b { width:64px; font-weight:500; color:var(--muted); font-size:13px }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 14px; min-height:36px }
  button[aria-pressed="true"] { background:var(--gold); color:#2a1d10; border-color:var(--gold); font-weight:600 }
  input[type=range] { flex:1; min-width:140px; accent-color:var(--gold) }
  output { width:40px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted) }
  .note { color:var(--muted); font-size:13px }
</style>
</head>
<body>
<header>
  <h1>ตัวละครใหม่ เทียบกับตัวเดิม</h1>
  <p>ซ้าย: ตัวเดิม · ขวา: ตัวใหม่แบบหุ่นตัดต่อ (ยังไม่ได้ใส่ในเกม)</p>
</header>
<canvas id="stage"></canvas>
<div class="controls">
  <div class="row" id="views"><b>มุม</b>
    <button data-v="auto" aria-pressed="true">เดินรอบลาน</button>
    <button data-v="side">ข้าง</button><button data-v="front">หน้า</button><button data-v="back">หลัง</button>
  </div>
  <div class="row" id="anims"><b>ท่า</b>
    <button data-a="idle">ยืน</button><button data-a="walk" aria-pressed="true">เดิน</button>
    <button data-a="run">วิ่ง</button><button data-a="hammer">ตีเหล็ก</button>
  </div>
  <div class="row"><b>ขนาดหัว</b><input id="head" type="range" min="0.9" max="1.4" step="0.05" value="1.15"><output id="headOut">1.15</output></div>
  <div class="row"><b>ขนาด</b>
    <button data-z="1">เท่าในเกม</button><button data-z="2.4" aria-pressed="true">ขยาย</button>
  </div>
  <p class="note" id="note"></p>
</div>
<script src="hero-rig.js?v=67"></script>
<script>
(() => {
  const cv = document.getElementById('stage'), g = cv.getContext('2d');
  HeroRig.load('hero/');
  const old = new Image(); old.src = 'player_sprite.webp?v=62';
  const ground = new Image(); ground.src = 'layer_ground_flatter.webp?v=62';
  const st = { view: 'auto', anim: 'walk', head: 1.15, zoom: 2.4 };
  const note = document.getElementById('note');

  function group(id, key, attr, parse) {
    const el = document.getElementById(id);
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      st[key] = parse ? parse(b.dataset[attr]) : b.dataset[attr];
      for (const x of el.querySelectorAll('button')) x.setAttribute('aria-pressed', x === b);
      if (key === 'anim' && st.anim === 'hammer' && st.view !== 'side') pick('views', 'side');
      if (key === 'view' && st.view !== 'side' && st.anim === 'hammer') pick('anims', 'walk');
    });
  }
  function pick(id, val) { const b = document.querySelector('#' + id + ' [data-' + (id === 'views' ? 'v' : 'a') + '="' + val + '"]'); if (b) b.click(); }
  group('views', 'view', 'v'); group('anims', 'anim', 'a');
  const zr = document.querySelector('.controls .row:nth-child(4)');
  zr.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.zoom = +b.dataset.z; for (const x of zr.querySelectorAll('button')) x.setAttribute('aria-pressed', x === b); });
  const head = document.getElementById('head'), headOut = document.getElementById('headOut');
  head.addEventListener('input', () => { st.head = +head.value; headOut.textContent = st.head.toFixed(2); });

  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  }
  addEventListener('resize', size); size();

  // old sprite: 4 frames per row, 400×680; row 0 = side walk, row 1 = front
  function drawOld(x, y, h, view, anim, t, face) {
    if (!old.complete || !old.naturalWidth) return;
    const moving = anim === 'walk' || anim === 'run', f = moving ? Math.floor(t * (anim === 'run' ? 12 : 8)) % 4 : 0;
    const row = view === 'side' ? 0 : 1, w = h * 400 / 680;
    g.save(); g.translate(x, y); g.scale(face, 1);
    g.drawImage(old, f * 400, row * 680, 400, 680, -w / 2, -h + h * 0.03, w, h); g.restore();
  }
  function shadow(x, y, w) { g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(x, y, w, w * 0.18, 0, 0, Math.PI * 2); g.fill(); }

  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000, W = cv.width, H = cv.height, d = cv.width / cv.getBoundingClientRect().width;
    g.fillStyle = '#4c5a46'; g.fillRect(0, 0, W, H);
    if (ground.complete && ground.naturalWidth) { const sh = ground.naturalHeight * 0.4; g.drawImage(ground, 0, ground.naturalHeight - sh, ground.naturalWidth * .5, sh, 0, H * 0.45, W, H * 0.55); }
    const h = 130 * st.zoom * d * Math.min(1, H / (130 * st.zoom * d * 1.25));
    let view = st.view, anim = st.anim, face = 1, ox = 0, oy = 0;
    if (st.view === 'auto') {                          // a little loop: right, down, left, up
      const c = (t / 2.2) % 4, k = c % 1, s = Math.min(W * 0.12, h * 0.9), v = h * 0.12;
      const seg = Math.floor(c);
      view = seg === 1 ? 'front' : seg === 3 ? 'back' : 'side';
      face = seg === 2 ? -1 : 1;
      ox = [(-s + 2 * s * k), s, (s - 2 * s * k), -s][seg];
      oy = [-v, (-v + 2 * v * k), v, (v - 2 * v * k)][seg];
      if (anim === 'hammer' || anim === 'idle') anim = 'walk';
    }
    const by = H * 0.86 + oy * d;
    const xs = [W * 0.27 + ox * d * 0.5, W * 0.73 + ox * d * 0.5];
    shadow(xs[0], by, h * 0.22); shadow(xs[1], by, h * 0.24);
    drawOld(xs[0], by, h, view, anim, t, face);
    g.save(); g.translate(xs[1], by); g.scale(face, 1);
    HeroRig.draw(g, { view, anim, t, height: h * 1.02, headScale: st.head });
    g.restore();
    g.fillStyle = 'rgba(243,230,211,.75)'; g.font = Math.round(12 * d) + 'px system-ui'; g.textAlign = 'center';
    g.fillText('ตัวเดิม', W * 0.27, H * 0.06 + 6 * d); g.fillText('ตัวใหม่', W * 0.73, H * 0.06 + 6 * d);
    note.textContent = view === 'back' ? 'ตัวเดิมไม่มีท่าหันหลัง จึงแสดงท่าหันหน้าแทน' : st.anim === 'hammer' ? 'ท่าตีเหล็กมีเฉพาะมุมข้าง' : '';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
