<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI video walk test</title>
<style>html,body{margin:0;background:#5a6a5a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="cv"></canvas>
<script>
// v151 walk made from an AI video (Kling): 36 frames at 24 fps, cells 243×273, feet at y 269, body centre x 105
const A={src:'anim/chibi_walk.webp?v=151',cols:6,n:36,fps:24,cw:243,ch:273,ax:105,base:269,h:265,speed:0.45};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),img=new Image();img.src=A.src;
let W,H;function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}rs();addEventListener('resize',rs);
const bg=new Image();bg.src='tower/floor1.webp?v=127';
function loop(){const t=performance.now()/1000,h=H*0.55,k=h/A.h,gy=H*0.86;
 ctx.setTransform(1,0,0,1,0,0);
 if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),bw=bg.naturalWidth*s,off=(t*A.speed*h*0.35)%bw;
   const bh=bg.naturalHeight*s,by=(H-bh)/2,o2=(t*A.speed*h*0.35)%(2*bw);for(let i=0,x=-o2;x<W;i++,x+=bw){if(i%2){ctx.save();ctx.translate(x+bw,by);ctx.scale(-1,1);ctx.drawImage(bg,0,0,bw,bh);ctx.restore();}else ctx.drawImage(bg,x,by,bw,bh);}}else{ctx.fillStyle='#5a6a5a';ctx.fillRect(0,0,W,H);}
 const v=A.speed*h,off=(t*v)%(h*0.3);ctx.fillStyle='rgba(0,0,0,.25)';
 for(let x=-off;x<W;x+=h*0.3)ctx.fillRect(x,gy+4,h*0.04,h*0.02);
 ctx.beginPath();ctx.ellipse(W*0.45,gy,h*0.2,h*0.03,0,0,Math.PI*2);ctx.fill();
 if(img.complete&&img.naturalWidth){const f=Math.floor(t*A.fps)%A.n,c=f%A.cols,r=Math.floor(f/A.cols);
   ctx.drawImage(img,c*A.cw,r*A.ch,A.cw,A.ch,W*0.45-A.ax*k,gy-A.base*k,A.cw*k,A.ch*k);}
 requestAnimationFrame(loop);}
loop();
</script></body></html>
