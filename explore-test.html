<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ทดสอบเดินสำรวจ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.bar button{background:rgba(20,16,10,.78);color:#f3e6c4;border:1px solid #8a6d3b;border-radius:8px;padding:7px 11px;font-size:13px}
.bar button.on{background:#7a5a22}
.tag{position:fixed;left:10px;top:10px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
</style></head><body>
<canvas id="cv"></canvas>
<div class="tag" id="tag"></div>
<div class="bar">
  <button id="bStop">หยุด</button><button id="bWalk" class="on">เดิน</button><button id="bRun">วิ่ง</button>
  <button id="bPrev">◀ ชั้น</button><button id="bNext">ชั้น ▶</button><button id="bVar">ฉากอื่น</button>
</div>
<script src="hero-clips.js?v=158"></script>
<script src="explore-art.js?v=158"></script>
<script>
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const C = HeroClips.hero_sword, EA = ExploreArt, cache = {};
  const im = s => cache[s] || (cache[s] = Object.assign(new Image(), { src: s }));
  const ok = i => i.complete && i.naturalWidth > 0;
  const q = new URLSearchParams(location.search);
  // feet line of the walkable path in each background (fraction of its height), checked by eye on every image
  const GROUND = { F1_A: .67, F1_B: .75, F1_C: .76, F2_B: .83, F2_C: .86, F3_B: .82, F3_C: .83, F4_B: .72, F4_C: .71,
    F5_B: .80, F5_C: .82, F6_B: .80, F6_C: .82, F7_B: .82, F7_C: .84, F8_B: .82, F8_C: .84, F9_B: .85, F9_C: .83 };
  // props: 'front' = low things that may pass in front of the hero's feet; 'back' = stands behind the path; 'no' = not used while walking
  const KIND = { F1_prop_fern: 'front', F1_prop_rocklog: 'front', F2_prop_glowingrock: 'front', F2_prop_root: 'front', F2_prop_mushrooms: 'back',
    F3_prop_ore: 'front', F4_prop_aquaticplants: 'front', F4_prop_reeds: 'front', F4_prop_spiritlamp: 'no', F8_prop_overgrowngrass: 'front',
    F7_prop_stonepile: 'front',
    F1_prop_tree_01: 'no', F1_prop_tree_02: 'no', F3_prop_support: 'no', F4_prop_stump: 'no' };  // trees and beams look like toys at prop size; a stump behind the boardwalk would float on the water
  const kindOf = n => KIND[n] || 'back';
  let floor = +q.get('f') || 1, seg = 0, mode = 'walk', hx = 0, W = 0, H = 0, dpr = 1, props = [], fadeT = -1, cur = 0, anT = 0;
  const rng = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const bgOf = () => EA[floor].bg[seg % EA[floor].bg.length];
  // a segment is one background walked from left to right; its props are fixed by floor + segment (save-seed friendly)
  function layout() {
    const r = rng(floor * 977 + seg * 131 + 7), P = EA[floor].props.filter(p => kindOf(p[0]) !== 'no');
    const back = P.filter(p => kindOf(p[0]) === 'back'), front = P.filter(p => kindOf(p[0]) === 'front');
    props = [];
    for (let u = 0.08 + r() * 0.1; u < 0.95; u += 0.22 + r() * 0.2) if (back.length) props.push({ p: back[Math.floor(r() * back.length)], u, front: false, flip: r() < 0.5, s: 0.8 + r() * 0.25 });
    for (let u = 0.2 + r() * 0.2; u < 0.95; u += 0.35 + r() * 0.3) if (front.length) props.push({ p: front[Math.floor(r() * front.length)], u, front: true, flip: r() < 0.5, s: 0.85 + r() * 0.2 });
  }
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
  addEventListener('resize', resize); resize();
  const speed = { stop: 0, walk: 0.30, run: 0.72 };  // hero speed in screen heights per second, matched to the clip's stride
  function setMode(m) { mode = m; ['Stop', 'Walk', 'Run'].forEach(k => document.getElementById('b' + k).classList.toggle('on', k.toLowerCase() === m)); }
  document.getElementById('bStop').onclick = () => setMode('stop');
  document.getElementById('bWalk').onclick = () => setMode('walk');
  document.getElementById('bRun').onclick = () => setMode('run');
  const start = () => { hx = 0; layout(); };
  const setFloor = f => { floor = (f + 8) % 9 + 1; seg = 0; start(); };
  document.getElementById('bPrev').onclick = () => setFloor(floor - 1);
  document.getElementById('bNext').onclick = () => setFloor(floor + 1);
  document.getElementById('bVar').onclick = () => { seg++; start(); };
  start();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const bg = bgOf(), B = im('tower/explore/' + bg[0] + '.webp');
    // background covers the screen (cropped from the top if it is narrow), bottom aligned
    const bs = Math.max(H / bg[2], W / bg[1]), bw = bg[1] * bs, bh = bg[2] * bs, yOff = H - bh, gy = yOff + (GROUND[bg[0]] || 0.82) * bh;
    const goal = fadeT >= 0 ? 0 : speed[mode];
    cur += (goal - cur) * Math.min(1, dt * 6);
    hx += cur * H * dt;                                   // the hero really walks over the picture; the camera follows
    if (fadeT < 0 && hx > bw - W * 0.08) fadeT = 0;       // end of this stretch: fade to the next one
    if (fadeT >= 0) { fadeT += dt; if (fadeT > 0.35 && fadeT - dt <= 0.35) { seg++; start(); } if (fadeT > 0.7) fadeT = -1; }
    const heroStart = W * 0.1, wx = heroStart + hx, cam = Math.max(0, Math.min(bw - W, wx - W * 0.38));
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (ok(B)) ctx.drawImage(B, -cam, yOff, bw, bh);
    const drawProps = front => {
      for (const o of props) {
        if (o.front !== front) continue;
        const I = im('tower/explore/' + o.p[0] + '.webp'); if (!ok(I)) continue;
        let ph = bh * (front ? 0.2 : 0.3) * o.s * Math.pow(o.p[2] / 560, 0.8);
        let base = front ? H + bh * 0.03 : gy - bh * 0.05;
        if (front) ph = Math.min(ph, base - gy - bh * 0.015);  // a front prop never rises above the hero's feet
        if (ph < bh * 0.05) continue;
        const pw = ph * o.p[1] / o.p[2], sx = o.u * bw - cam;
        if (sx + pw < 0 || sx - pw > W) continue;
        ctx.save(); ctx.translate(sx, base); ctx.scale(o.flip ? -1 : 1, 1);
        if (front) ctx.filter = 'brightness(0.72)';
        ctx.drawImage(I, -pw / 2, -ph, pw, ph); ctx.restore();
      }
    };
    drawProps(false);
    const act = cur < 0.04 ? 'idle' : mode === 'run' || cur > 0.5 ? 'run' : 'walk', M = C.acts[act];
    anT += dt * (act === 'idle' ? 1 : cur / speed[act]);
    const f = Math.floor(anT * M.fps) % M.n, I = im(C.dir + act + '.webp?v=' + C.ver), k = H * 0.34 / C.h, px = wx - cam;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, gy, H * 0.065, H * 0.013, 0, 0, 7); ctx.fill();
    if (ok(I)) ctx.drawImage(I, (f % M.cols) * M.cw, Math.floor(f / M.cols) * M.ch, M.cw, M.ch, px - M.ax * k, gy - M.ay * k, M.cw * k, M.ch * k);
    drawProps(true);
    if (fadeT >= 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, 1 - Math.abs(fadeT - 0.35) / 0.35) + ')'; ctx.fillRect(0, 0, W, H); }
    document.getElementById('tag').textContent = 'ชั้น ' + floor + ' · ' + bg[0];
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
