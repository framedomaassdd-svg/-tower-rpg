<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tower RPG — ทดลองระบบต่อสู้</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:-apple-system,'Sukhumvit Set','Noto Sans Thai',sans-serif;color:#f3ead8}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #top{position:fixed;right:10px;top:10px;display:flex;gap:6px;z-index:5}
  #top button,.panel button,.bt-acts button{font:inherit;border:1px solid #c9a35a;background:rgba(40,28,18,.88);color:#fbe9c4;border-radius:10px;padding:7px 12px;font-size:14px}
  #top button.on{background:#c9a35a;color:#2a1a0a}
  #ui{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;z-index:5;pointer-events:none}
  .bt-turn{pointer-events:auto;background:rgba(25,18,12,.86);border:1px solid #c9a35a;border-radius:14px;padding:8px 10px 10px;max-width:96vw}
  .bt-bar{height:5px;background:#3a2a1a;border-radius:3px;overflow:hidden;margin-bottom:8px}
  .bt-bar i{display:block;height:100%;width:100%;background:#ffd36b;transform-origin:left;animation:bt-count linear forwards}
  @keyframes bt-count{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .bt-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .bt-acts button small{display:block;font-size:11px;opacity:.75}
  .bt-acts button:disabled{opacity:.4}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9}
  .panel>div{background:rgba(30,22,14,.95);border:1px solid #c9a35a;border-radius:16px;padding:16px 18px;max-width:560px;width:92vw}
  .panel h2{margin:0 0 6px;font-size:19px}.panel p{margin:4px 0 10px;font-size:13px;opacity:.85}
  .panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .panel button small{display:block;font-size:11px;opacity:.7}
  #rot{display:none}
  @media (orientation:portrait) and (max-width:900px){#rot{display:flex;position:fixed;inset:0;z-index:20;background:#111;align-items:center;justify-content:center;font-size:18px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><button id="auto">ออโต้: ปิด</button><button id="spd">ความเร็ว ×1</button><button id="menu">เลือกฉาก</button></div>
<div id="ui"></div>
<div id="rot">หมุนจอเป็นแนวนอน</div>
<script src="tower-view.js?v=127&motion=140"></script>
<script src="rig.js?v=146"></script>
<script src="battle.js?v=141"></script>
<script src="hero-clips.js?v=152"></script>
<script src="battle-view.js?v=143&clip=152"></script>
<script>
(function () {
  const cv = document.getElementById('cv'), ui = document.getElementById('ui');
  const ART = new URLSearchParams(location.search).get('art') || 'clip'; let ctl = null, auto = false, speed = 1, heroPips = 3, potions = 2, last = null;
  const HERO = () => ({ kind: 'hero', name: 'ฮีโร่', pow: 31, spd: 12, max: 3, pips: heroPips, skills: ['stormLance', 'earthBulwark', 'ironSkin', 'quickStep'], def: 8, row: 0,
    art: ART === 'clip' ? { type: 'clip', id: 'hero_sword' } : ART === 'rig' ? { type: 'rig', id: 'hero_craft_m' } : { type: 'hero', src: 'npc5_heroCombat.webp?v=127', row: 0 } });
  const ALLY = {
    tank:   { kind: 'ally', name: 'โล่หญิง', pow: 30, spd: 9, max: 4, def: 20, row: 0, skills: ['taunt'], art: { type: 'ally', src: 'npc_combat/shieldmaiden.webp?v=131' } },
    priest: { kind: 'ally', name: 'นักบวช', pow: 18, spd: 11, max: 3, row: 1, ranged: true, skills: ['mend'], art: { type: 'ally', src: 'npc_combat/priest.webp?v=131' } },
    ranger: { kind: 'ally', name: 'นักธนู', pow: 26, spd: 13, max: 3, row: 1, ranged: true, skills: ['volley'], art: { type: 'ally', src: 'npc_combat/ranger.webp?v=131' } }
  };
  const MON = (name, id, pow, spd, rank, row, extra) => Object.assign({ kind: 'mon', name, pow, spd, rank, max: Battle.RANK_PIPS[rank] || 3, row: row || 0, art: { type: 'mon', id } }, extra || {});
  const SC = [
    { name: 'เดี่ยว ปะทะ หมาป่าเงา', hint: 'ชั้น 1 · มอนทั่วไป 3 จุด', bg: 'tower/floor1.webp?v=127', team: [], foes: () => [MON('หมาป่าเงา', 'wolf', 24, 14, 'Normal')] },
    { name: 'เดี่ยว ปะทะ ฝูงหมาป่า 3 ตัว', hint: 'ไปคนเดียว = ตายง่าย', bg: 'tower/floor1.webp?v=127', team: [], foes: () => [MON('หมาป่าเงา', 'wolf', 24, 14, 'Normal'), MON('หมาป่าเงา', 'wolf', 22, 15, 'Normal', 1), MON('หมาป่าเงา', 'wolf', 23, 13, 'Normal', 1)] },
    { name: 'ทีม 4 คน ปะทะ ฝูงหมาป่า', hint: 'โล่ล่อเป้า · นักบวชฮีล · ธนูยิงหลังแถว', bg: 'tower/floor1.webp?v=127', team: ['tank', 'priest', 'ranger'], foes: () => [MON('หมาป่าเงา', 'wolf', 24, 14, 'Normal'), MON('หมาป่าเงา', 'wolf', 22, 15, 'Normal', 1), MON('ก๊อบลินถือขวาน', 'goblin', 32, 11, 'Normal', 0)] },
    { name: 'ทีม ปะทะ จ่าฝูงกวางพิษ', hint: 'ชั้น 2 · ยศกัปตัน 5 จุด + ลูกน้อง', bg: 'tower/floor2.webp?v=127', team: ['tank', 'priest', 'ranger'], foes: () => [MON('จ่าฝูงกวางพิษ', 'deer', 58, 12, 'Captain', 0, { elite: true, max: 7, def: 22 }), MON('แมงมุมสปอร์', 'spider', 27, 13, 'Normal', 1)] },
    { name: 'ทีม ปะทะ ผู้พิทักษ์ชั้น 4', hint: 'บอส 10 จุด', bg: 'tower/floor4.webp?v=127', team: ['tank', 'priest', 'ranger'], foes: () => [MON('วิญญาณจมน้ำ · ผู้พิทักษ์', 'drowned', 70, 10, 'Captain', 0, { max: 10, def: 26, art: { type: 'mon', id: 'drowned', scale: 1.3 } })] }
  ];
  function run(sc) {
    if (ctl) ctl.stop(); last = sc;
    const allies = [HERO(), ...sc.team.map(k => Object.assign({}, ALLY[k]))];
    const b = Battle.create({ allies, foes: sc.foes(), seed: (Math.random() * 1e9) | 0, potions });
    ctl = BattleView.start(cv, ui, b, { bg: sc.bg, auto, onEnd: (res, bb) => {
      const h = bb.units.find(x => x.kind === 'hero'); heroPips = Math.max(0, h.pips); potions = bb.potions;
      end(res, h);
    } });
    ctl.setSpeed(speed);
  }
  function end(res, h) {
    const p = document.createElement('div'); p.className = 'panel';
    const dead = res !== 'win';
    p.innerHTML = `<div><h2>${dead ? '💀 ฮีโร่ล้ม' : '🏆 ชนะ'}</h2><p>${dead ? 'จุดเลือดหมด = ตาย (ในเกมจริงถ้ามีเพื่อนแกร่งกว่าอาจช่วยไว้ได้)' : 'เลือดที่เหลือ ' + h.pips + '/' + h.max + ' จุด · ยาเหลือ ' + potions + ' ขวด'}</p>
      <div class="grid">${dead ? '' : `<button data-k="again">สู้ต่อทันที<small>ไม่พัก จุดไม่ฟื้น</small></button>`}
      <button data-k="rest">พักฟื้นแล้วสู้ใหม่<small>จุดเต็ม · ยา 2 ขวด</small></button><button data-k="menu">เลือกฉากอื่น</button></div></div>`;
    document.body.appendChild(p);
    p.querySelectorAll('button').forEach(btn => btn.onclick = () => {
      p.remove(); const k = btn.dataset.k;
      if (k === 'rest') { heroPips = 3; potions = 2; run(last); } else if (k === 'again') run(last); else menu();
    });
  }
  function menu() {
    if (ctl) { ctl.stop(); ctl = null; }
    const p = document.createElement('div'); p.className = 'panel';
    p.innerHTML = `<div><h2>ทดลองระบบต่อสู้ (ต้นแบบ)</h2><p>ลำดับตีตามความคล่องตัว (แถบบน: ทีมเราอยู่บนเส้น มอนอยู่ใต้เส้น ซ้ายสุดได้ตีก่อน) · จุดแดง = เลือด จุดขาว = โล่ · เกราะหนาหรือบัพลดดาเมจ ทำให้โดนแค่ครึ่งจุด · ตาฮีโร่: กดสกิล/ยาเองได้ ไม่กดภายในเวลาจะตีปกติ · เปิดออโต้ได้มุมขวาบน</p>
      <div class="grid">${SC.map((s, i) => `<button data-i="${i}">${s.name}<small>${s.hint}</small></button>`).join('')}</div></div>`;
    document.body.appendChild(p);
    p.querySelectorAll('button').forEach(btn => btn.onclick = () => { p.remove(); heroPips = 3; potions = 2; run(SC[+btn.dataset.i]); });
  }
  document.getElementById('auto').onclick = e => { auto = !auto; e.target.textContent = 'ออโต้: ' + (auto ? 'เปิด' : 'ปิด'); e.target.classList.toggle('on', auto); if (ctl) ctl.setAuto(auto); };
  document.getElementById('spd').onclick = e => { speed = speed === 1 ? 2 : 1; e.target.textContent = 'ความเร็ว ×' + speed; if (ctl) ctl.setSpeed(speed); };
  document.getElementById('menu').onclick = menu;
  window.BT = { run: i => run(SC[i]), SC, menu, get ctl() { return ctl; } };
  menu();
})();
</script>
</body>
</html>
