<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tower RPG</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;background:#151922;color:#fff;font-family:system-ui;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
button{border:1px solid #ffffff88;background:#17202bcf;color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{background:#88613c}
#speed,#pause{position:fixed;top:max(12px,env(safe-area-inset-top));border-radius:9px;padding:8px 12px;font-size:14px;z-index:12}
#speed{right:110px}#pause{right:16px}
@media(max-width:520px){#speed{right:16px}#pause{top:calc(max(12px,env(safe-area-inset-top)) + 42px)}}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#293b3a;color:#fff;font:18px system-ui}
#saveWarning,#assetWarning{position:fixed;top:128px;left:16px;z-index:20;max-width:min(530px,75vw);padding:8px 12px;border-radius:9px;background:#792d2de8;color:#fff;font-size:13px;line-height:1.35}
#assetWarning{top:174px}
#loading[hidden],#saveWarning[hidden],#assetWarning[hidden]{display:none}
</style>
<style>
/* v128 the game is played in landscape: on a phone held upright, ask to turn it (Safari cannot lock the orientation) */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#140e0a;color:#f3e6cc;align-items:center;justify-content:center;flex-direction:column;text-align:center;font:18px/1.5 system-ui,sans-serif;padding:24px}
#rotate .ph{font-size:64px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="loading" role="status">กำลังโหลดเมือง…</div>
<canvas id="view"></canvas>
<div id="saveWarning" role="alert" hidden></div>
<div id="assetWarning" role="alert" hidden></div>
<button id="speed" aria-label="เปลี่ยนความเร็วเวลา">เวลา ×1</button>
<button id="pause" aria-label="หยุดเวลา">หยุดเวลา</button>
<script src="ambient.js?v=90"></script>
<script src="town-pano.js?v=104"></script>
<script src="city-core.js?v=108"></script>
<script src="hero-look.js?v=126&tower=127&fix=128"></script><script src="tower-view.js?v=127&fix=134&floors=138"></script><script src="town-residents.js?v=90"></script><script src="town-npcs.js?v=125&look=126&adv=131"></script>
<script src="city-lighting.js?v=70" onerror="document.getElementById('loading').textContent='โหลดไฟล์เกมไม่ครบ ลองโหลดหน้าใหม่อีกครั้ง'"></script>
<script src="artisan.js?v=121&addon=122"></script><script src="alchemy.js?v=120&addon=122"></script><script src="tower-regions.js?v=136"></script><script src="bag.js?v=119&addon=122&tower=127&cards=134b&floors=136"></script><script src="skills.js?v=119&addon=121&tower=127&cards=134b&floors=135"></script><script src="tower-slot-engine.js?v=109"></script><script src="main-story.js?v=118"></script><script src="expedition.js?v=119&addon=121&management=124&tower=127&cards=134b&floors=138"></script>
<script src="management.js?v=124&art=125&adv=131"></script>
<script src="life-sim.js?v=119&addon=122&management=124&art=125&look=126&tower=127&fix=128&cards=134b"></script>
<script src="tutorial.js?v=122"></script><script src="craft-game.js?v=122"></script>
<script src="alchemy-minigame.js?v=122&art=124"></script><script src="cook-minigame.js?v=122&art=124"></script>
<script src="smith-minigame.js?v=64&addon=122&art=124"></script><script src="carrot-minigame.js?v=71&addon=122&art=124"></script>
<script src="hero-sprite.js?v=68&look=126"></script>
<script src="interiors.js?v=125&look=126"></script>
<script src="life-ui.js?v=119&addon=122&management=124&art=125&look=126&tower=127&fix=131&cards=134b&floors=138"></script>
<script src="game.js?v=106&gear=113&management=124&look=126&tower=127&fix=128"></script>
<div id="rotate"><div class="ph">📱</div><p><b>หมุนโทรศัพท์เป็นแนวนอน</b><br>เกมนี้เล่นในแนวนอน</p></div>
</body>
</html>
