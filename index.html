<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tower RPG</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;background:#151922;color:#fff;font-family:system-ui;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
button{border:1px solid #ffffff88;background:#17202bcf;color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{background:#88613c}
#speed,#pause{position:fixed;top:max(12px,env(safe-area-inset-top));border-radius:9px;padding:8px 12px;font-size:14px;z-index:12}
#speed{right:110px}#pause{right:16px}
@media(max-width:520px){#speed{right:16px}#pause{top:calc(max(12px,env(safe-area-inset-top)) + 42px)}}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#293b3a;color:#fff;font:18px system-ui}
#saveWarning,#assetWarning{position:fixed;top:128px;left:16px;z-index:20;max-width:min(530px,75vw);padding:8px 12px;border-radius:9px;background:#792d2de8;color:#fff;font-size:13px;line-height:1.35}
#assetWarning{top:174px}
#loading[hidden],#saveWarning[hidden],#assetWarning[hidden]{display:none}
</style>
</head>
<body>
<div id="loading" role="status">กำลังโหลดเมือง…</div>
<canvas id="view"></canvas>
<div id="saveWarning" role="alert" hidden></div>
<div id="assetWarning" role="alert" hidden></div>
<button id="speed" aria-label="เปลี่ยนความเร็วเวลา">เวลา ×1</button>
<button id="pause" aria-label="หยุดเวลา">หยุดเวลา</button>
<script src="town-pano.js?v=70"></script>
<script src="city-core.js?v=70"></script>
<script src="town-residents.js?v=70"></script>
<script src="city-lighting.js?v=70" onerror="document.getElementById('loading').textContent='โหลดไฟล์เกมไม่ครบ ลองโหลดหน้าใหม่อีกครั้ง'"></script>
<script src="life-sim.js?v=70"></script>
<script src="smith-minigame.js?v=64"></script>
<script src="hero-sprite.js?v=68"></script>
<script src="interiors.js?v=70"></script>
<script src="life-ui.js?v=70"></script>
<script src="game.js?v=70"></script>
</body>
</html>
